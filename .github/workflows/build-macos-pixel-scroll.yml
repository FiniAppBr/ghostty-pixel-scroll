name: Build macOS (pixel-scroll, unsigned)

# Builds an unsigned Ghostty.app with the pixel-scroll changes. GitHub's
# macOS runners ship Xcode, which is the only reason this exists: the
# machine this branch is developed on has Command Line Tools only, so the
# app itself can only be built here.
#
# The last step pushes the outcome and the build log to the `ci-results`
# branch. That's so the result can be read over plain git (`git fetch`),
# without a GitHub token, from a machine that only has SSH access.

on:
  workflow_dispatch:
  push:
    branches: [pixel-scroll, fluid]

# A newer push makes an in-flight build pointless; macOS minutes bill at
# 10x so it's worth not paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CI_LOG: ${{ github.workspace }}/../ci.log
    steps:
      - uses: actions/checkout@v5

      # The Zig cache carries the compiled C/C++ dependencies, which change
      # only when build.zig.zon does. Restore-keys let a run start from the
      # previous build's cache and recompile just what changed.
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig') }}-
            zig-${{ runner.os }}-

      # Sparkle is resolved over SwiftPM every run, and Xcode 26 can reuse
      # compiled Swift across runs given a CAS directory.
      - name: Cache Xcode
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: xcode-${{ runner.os }}-${{ hashFiles('macos/Ghostty.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ hashFiles('macos/Ghostty.xcodeproj/project.pbxproj') }}-
            xcode-${{ runner.os }}-

      - name: Use the newest installed Xcode
        id: xcode
        run: |
          set -eo pipefail
          {
            echo "=== xcode ==="
            newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
            xcodebuild -version
            sw_vers
            ls -d /Applications/Xcode*.app 2>/dev/null || true
          } 2>&1 | tee -a "$CI_LOG"

      - name: Install Zig
        id: zig
        run: |
          set -eo pipefail
          {
            echo "=== zig === $(date -u +%T)"
            ZIG_VERSION="$(grep -o 'minimum_zig_version = "[^"]*"' build.zig.zon | cut -d'"' -f2)"
            echo "Using Zig $ZIG_VERSION"
            curl -sL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
            tar xf zig.tar.xz
            echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
            "$PWD/zig-aarch64-macos-${ZIG_VERSION}/zig" version
          } 2>&1 | tee -a "$CI_LOG"

      # The parts of this branch that are ours are pure logic and carry
      # their own tests. Running them before the app build means a broken
      # state machine fails in seconds rather than after a full Xcode
      # build, and the failure is legible in the log we push back.
      - name: Unit tests
        id: tests
        run: |
          set -eo pipefail
          {
            echo "=== tests === $(date -u +%T)"
            zig build test \
              -Dtest-filter=prediction \
              -Dtest-filter=animation \
              -Dtest-filter=cursor_rect \
              -Doptimize=Debug
            echo "tests passed"
          } 2>&1 | tee -a "$CI_LOG"

      # GhosttyKit is the Zig side, consumed by the Xcode project.
      - name: Build GhosttyKit
        id: ghosttykit
        run: |
          set -eo pipefail
          {
            echo "=== GhosttyKit === $(date -u +%T)"
            zig build -Demit-macos-app=false -Doptimize=ReleaseFast -Dxcframework-target=native
          } 2>&1 | tee -a "$CI_LOG"

      # Built with Xcode tooling and ad-hoc signed: no Developer ID here,
      # so the download needs its quarantine bit stripped before it runs.
      - name: Build Ghostty.app
        id: app
        working-directory: macos
        run: |
          set -eo pipefail
          {
            echo "=== xcodebuild === $(date -u +%T)"
            xcodebuild -list -project Ghostty.xcodeproj || true
            # -derivedDataPath requires -scheme (not -target), and
            # ReleaseLocal is the configuration upstream uses for unsigned
            # local builds. Signing is left enabled but ad-hoc ("-"), since
            # the embedded Sparkle framework still needs to be signed.
            # GhosttyKit is built for the native arch only (-Dxcframework-target=native),
            # so Xcode must not try for a universal binary: the scheme would
            # otherwise link x86_64 and fail on missing symbols.
            xcodebuild -scheme Ghostty -configuration ReleaseLocal \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              COMPILATION_CACHE_ENABLE_CACHING=YES \
              COMPILATION_CACHE_CAS_PATH="$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex" \
              COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              -derivedDataPath "$RUNNER_TEMP/DerivedData"
          } 2>&1 | tee -a "$CI_LOG"

      - name: Package
        id: package
        run: |
          set -eo pipefail
          {
            echo "=== package === $(date -u +%T)"
            APP="$(find "$RUNNER_TEMP/DerivedData" -name 'Ghostty.app' -maxdepth 6 -type d | head -1)"
            if [ -z "$APP" ]; then echo "Ghostty.app not found"; exit 1; fi
            echo "Found: $APP"
            codesign --force --deep --sign - "$APP"
            ditto -c -k --keepParent "$APP" ghostty-macos-pixel-scroll.zip
            ls -lh ghostty-macos-pixel-scroll.zip
          } 2>&1 | tee -a "$CI_LOG"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ghostty-macos-pixel-scroll
          path: ghostty-macos-pixel-scroll.zip
          if-no-files-found: error

      # Artifact downloads need API auth, which the dev machine doesn't
      # have. Push the build itself to a branch so it can be fetched over
      # plain git. Force-pushed each run, so only the latest is carried.
      - name: Publish the build to ci-artifact branch
        if: success()
        run: |
          set -e
          WORK="$RUNNER_TEMP/artifact"
          rm -rf "$WORK"; mkdir -p "$WORK"
          cp ghostty-macos-pixel-scroll.zip "$WORK/"
          cd "$WORK"
          echo "${{ github.sha }}  run ${{ github.run_id }}  $(date -u +%FT%TZ)" > BUILD.txt
          git init -q .
          git checkout -q -b ci-artifact
          git add -A
          git -c user.name="ghostty-ci" -c user.email="ci@example.invalid" \
            commit -q -m "build for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            ci-artifact

      # Report the outcome where a token-less machine can read it.
      - name: Publish result to ci-results branch
        if: always()
        run: |
          set +e
          WORK="$RUNNER_TEMP/report"
          rm -rf "$WORK"; mkdir -p "$WORK"; cd "$WORK"

          cp "$CI_LOG" build.log 2>/dev/null || echo "(no log captured)" > build.log
          tail -c 300000 build.log > build.tail.log
          grep -nE "error:|error!|failed|FAILED|\*\* BUILD FAILED" build.log | tail -100 > errors.txt

          cat > status.md <<EOF
          # CI result

          - run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})
          - sha: ${{ github.sha }}
          - ref: ${{ github.ref_name }}
          - job status: ${{ job.status }}
          - finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## step outcomes

          | step | outcome |
          | --- | --- |
          | xcode select | ${{ steps.xcode.outcome }} |
          | install zig | ${{ steps.zig.outcome }} |
          | build GhosttyKit | ${{ steps.ghosttykit.outcome }} |
          | build Ghostty.app | ${{ steps.app.outcome }} |
          | package | ${{ steps.package.outcome }} |

          See build.tail.log for the log and errors.txt for grepped failures.
          EOF

          git init -q .
          git checkout -q -b ci-results
          git add -A
          git -c user.name="ghostty-ci" -c user.email="ci@example.invalid" \
            commit -q -m "CI ${{ job.status }} for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            ci-results
          echo "pushed ci-results: $?"
